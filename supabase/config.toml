# Supabase CLI configuration for local development (`npm run db:start`).
project_id = "mealprepper"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m0s"


# German email templates. For the hosted project paste the same files under
# Dashboard -> Authentication -> Email Templates (see docs/PRODUCTION.md).
[auth.email.template.confirmation]
subject = "Bestätige deine E-Mail-Adresse für MealPrepper"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Dein Anmelde-Link für MealPrepper"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Passwort zurücksetzen – MealPrepper"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Neue E-Mail-Adresse bestätigen – MealPrepper"
content_path = "./supabase/templates/email_change.html"
